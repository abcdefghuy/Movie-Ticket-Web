<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/web-layout.html}"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div layout:fragment="content">
    <div class="preloader">
        <div class="preloader-inner">
            <div class="preloader-icon">
                <span></span> <span></span>
            </div>
        </div>
    </div>
    <!-- ==========Preloader========== -->

    <!-- ==========Movie-Section========== -->
    <section class="movie-section padding-top padding-bottom">
        <div class="container">
            <div class="row flex-wrap-reverse justify-content-center">
                <div class="col-lg-11 mb-50 mb-lg-0">
                    <div class="filter-tab tab">
                        <div class="filter-area">
                            <div class="filter-main">
                                <div class="left">
                                    <div class="item">
                                        <span class="show">Sort By :</span>
                                        <select class="select-bar" id="filter" onchange="fetchMovies(this.value)">
                                            <option value="showing">Phim Đang Chiếu</option>
                                            <option value="comingSoon">Phim Sắp Chiếu</option>
                                            <option value="all">Tất Cả Phim</option>
                                        </select>
                                    </div>
                                </div>
                                <ul class="grid-button tab-menu">
                                    <li><i class="fas fa-th"></i></li>
                                    <li class="active"><i class="fas fa-bars"></i></li>
                                </ul>
                            </div>
                        </div>
                        <div class="tab-area">
                            <div class="tab-item">
                                <div class="row mb-10 justify-content-center">
                                    <div class="col-sm-6 col-lg-4" >
                                        <div class="movie-grid">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="tab-item active">
                                <div class="movie-area mb-10">
                                    <div class="movie-list">
                                    </div> <!-- END movie-list -->
                                </div>
                            </div> <!-- END tab-item active -->
                        </div> <!-- END tab-area -->
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
<!-- ==========Preloader========== -->

</body>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetchMovies("showing"); // Mặc định hiển thị phim đang chiếu
    });

    async function fetchMovies(filter) {
        const moviesGrid = document.getElementById("movies-grid"); // Grid view
        const moviesList = document.getElementById("movies-list"); // List view

        moviesGrid.innerHTML = "<p>Đang tải...</p>";
        moviesList.innerHTML = "<p>Đang tải...</p>";

        try {
            let apiUrl = "/movies"; // API mặc định
            if (filter === "showing") apiUrl = "movies/showing";
            if (filter === "comingSoon") apiUrl = "movies/coming-soon";

            const response = await fetch(apiUrl);
            const movies = await response.json();

            if (movies.length === 0) {
                moviesGrid.innerHTML = "<p>Không có phim nào.</p>";
                moviesList.innerHTML = "<p>Không có phim nào.</p>";
                return;
            }

            // Render dạng Grid
            moviesGrid.innerHTML = movies.map(movie => `
            <div class="col-sm-6 col-lg-4">
                <div class="movie-grid">
                    <div class="movie-thumb c-thumb">
                        <a href="/review?movieID=${movie.movieID}">
                            <img src="${movie.image.startsWith('https') ? movie.image : '/image?fname=' + movie.image}"
                                 alt="${movie.movieName}" class="movie-img">
                        </a>
                    </div>
                    <div class="movie-content bg-one">
                        <h5 class="title m-0">
                            <a href="/review?movieID=${movie.movieID}">${movie.movieName}</a>
                        </h5>
                        <ul class="movie-action-list">
                            <div>
                                <a href="/signin" class="custom-button">
                                    <i class="bi bi-ticket-perforated-fill"></i> Book Ticket
                                </a>
                            </div>
                            <div>
                                <a href="/review?movieID=${movie.movieID}" class="custom-button flaticon-loupe">Detail</a>
                            </div>
                        </ul>
                    </div>
                </div>
            </div>
        `).join("");

            // Render dạng List
            moviesList.innerHTML = movies.map(movie => `
            <div class="movie-list">
                <div class="movie-thumb c-thumb">
                    <a href="/review?movieID=${movie.movieID}">
                        <img src="${movie.image.startsWith('https') ? movie.image : '/image?fname=' + movie.image}"
                             alt="${movie.movieName}" class="movie-img">
                    </a>
                </div>

                <div class="movie-content bg-one">
                    <h5 class="title">
                        <a href="/review?movieID=${movie.movieID}">${movie.movieName}</a>
                    </h5>
                    <p class="duration">
                        <strong>Thời lượng:</strong> ${movie.movieDuration} phút
                    </p>
                    <ul class="movie-rating-percent">
                        <li>
                            <span class="content"><strong>Thể loại:</strong> ${movie.category}</span>
                        </li>
                        <li>
                            <span class="content"><strong>Khởi chiếu:</strong> ${new Date(movie.releaseDay).toLocaleDateString('vi-VN')}</span>
                        </li>
                    </ul>
                    <div class="book-area">
                        <div class="book-ticket">
                            <div class="react-item mr-auto">
                                <a href="/signin">
                                    <div class="thumb">
                                        <img src="/assets/images/icons/book.png" alt="icons">
                                    </div>
                                    <span>Đặt vé</span>
                                </a>
                            </div>
                            <div class="react-item mr-auto">
                                <a href="/review?movieID=${movie.movieID}">
                                    <div class="thumb">
                                        <img src="/assets/images/icons/play-button.png" alt="icons">
                                    </div>
                                    <span>Chi tiết</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `).join("");

        } catch (error) {
            console.error("Lỗi khi tải phim:", error);
            moviesGrid.innerHTML = "<p>Lỗi khi tải dữ liệu!</p>";
            moviesList.innerHTML = "<p>Lỗi khi tải dữ liệu!</p>";
        }
    }
</script>
